<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#2a2108"/>
      <stop offset="0.55" stop-color="#0d0b06"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.45" stop-color="#e5cf87"/>
      <stop offset="1" stop-color="#b8922e"/>
    </linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9c7a1f"/>
      <stop offset="0.5" stop-color="#f3d98b"/>
      <stop offset="1" stop-color="#9c7a1f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- cincin emas tipis (di dalam zona aman maskable) -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#goldH)" stroke-width="5" opacity="0.55"/>
  <!-- mahkota -->
  <g filter="url(#glow)">
    <path d="M142 296 L124 170 L200 226 L256 128 L312 226 L388 170 L370 296 Z"
          fill="url(#gold)" stroke="#fff0b8" stroke-width="4" stroke-linejoin="round"/>
    <rect x="142" y="306" width="228" height="26" rx="8" fill="url(#gold)"/>
    <circle cx="124" cy="164" r="13" fill="#fff0b8"/>
    <circle cx="256" cy="120" r="15" fill="#fff0b8"/>
    <circle cx="388" cy="164" r="13" fill="#fff0b8"/>
  </g>
  <!-- tuts piano -->
  <g>
    <rect x="142" y="346" width="228" height="62" rx="9" fill="#f6efd8"/>
    <g stroke="#8c7a45" stroke-width="3">
      <line x1="180" y1="346" x2="180" y2="408"/>
      <line x1="218" y1="346" x2="218" y2="408"/>
      <line x1="256" y1="346" x2="256" y2="408"/>
      <line x1="294" y1="346" x2="294" y2="408"/>
      <line x1="332" y1="346" x2="332" y2="408"/>
    </g>
    <g fill="#0b0b10">
      <rect x="169" y="346" width="22" height="38" rx="4"/>
      <rect x="207" y="346" width="22" height="38" rx="4"/>
      <rect x="283" y="346" width="22" height="38" rx="4"/>
      <rect x="321" y="346" width="22" height="38" rx="4"/>
    </g>
    <!-- penanda seperempat nada -->
    <circle cx="256" cy="396" r="6" fill="#d4af37"/>
  </g>
</svg>
