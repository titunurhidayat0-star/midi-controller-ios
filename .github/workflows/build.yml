name: Build Web MIDI iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Ambil Kode Proyek
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Inisialisasi Proyek & Capacitor
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi
        
        # Install Capacitor CLI & Core versi 5 yang stabil untuk CI/CD
        npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/ios@5
        
        # Siapkan folder asset web www
        mkdir -p www
        cp -R index.html *.js *.css *.json assets/ www/ 2>/dev/null || true
        
        # Bersihkan konfigurasi lama
        rm -rf capacitor.config.json capacitor.config.ts ios
        
        # Inisialisasi ulang
        npx cap init "MIDI Controller" "com.midi.controller" --web-dir www
        npx cap add ios
        
        # Naikkan target iOS di Podfile ke 14.0
        if [ -f ios/App/Podfile ]; then
          sed -i '' "s/platform :ios, '.*/platform :ios, '14.0'/g" ios/App/Podfile
        fi
        
        # Jalankan pod install manual di folder ios/App
        cd ios/App && pod install && cd ../..

    - name: Tambahkan Izin Hardware MIDI & Bluetooth di Info.plist
      run: |
        PLIST="ios/App/App/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Aplikasi membutuhkan akses MIDI/Bluetooth untuk terhubung ke keyboard Korg.'" $PLIST || true
        /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'Aplikasi membutuhkan akses MIDI untuk instrumen.'" $PLIST || true

    - name: Compile Proyek Xcode ke .app
      run: |
        xcodebuild -workspace ios/App/App.xcworkspace \
                   -scheme App \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   BUILD_DIR=$PWD/build

    - name: Bungkus ke Format .ipa
      run: |
        mkdir -p Payload
        APP_PATH=$(find build -name "*.app" -type d | head -n 1)
        cp -r "$APP_PATH" Payload/
        zip -r MIDI-Royale-Pro.ipa Payload

    - name: Simpan dan keluarkan File .ipa
      uses: actions/upload-artifact@v4
      with:
        name: Hasil-Build-IPA
        path: MIDI-Royale-Pro.ipa
