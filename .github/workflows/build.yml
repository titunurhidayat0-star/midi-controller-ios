name: Build Web MIDI iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Ambil Kode Proyek
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Inisialisasi Proyek & Capacitor
      run: |
        if [ ! -f package.json ]; then
          npm init -y
        fi
        
        # Install Capacitor 5 beserta plugin Native Web MIDI / CoreMIDI
        npm install @capacitor/core@5 @capacitor/cli@5 @capacitor/ios@5 @capacitor-community/web-midi
        
        # Siapkan folder asset web www
        mkdir -p www
        cp -R index.html *.js *.css *.json assets/ www/ 2>/dev/null || true
        
        # Bersihkan konfigurasi lama
        rm -rf capacitor.config.json capacitor.config.ts ios
        
        # Inisialisasi proyek Capacitor
        npx cap init "MIDI Royale Pro" "com.midi.royale.pro" --web-dir www
        npx cap add ios
        
        # Lock target iOS ke 14.0 agar CocoaPods tidak error
        if [ -f ios/App/Podfile ]; then
          sed -i '' "s/platform :ios, '.*/platform :ios, '14.0'/g" ios/App/Podfile
        fi
        
        cd ios/App && pod install && cd ../..

    - name: Tambahkan Izin CoreMIDI & Hardware di Info.plist
      run: |
        PLIST="ios/App/App/Info.plist"
        /usr/libexec/PlistBuddy -c "Add :NSBluetoothAlwaysUsageDescription string 'Aplikasi MIDI Royale Pro membutuhkan akses MIDI/Bluetooth/SysEx untuk terhubung ke keyboard Korg.'" $PLIST || true
        /usr/libexec/PlistBuddy -c "Add :NSBluetoothPeripheralUsageDescription string 'Aplikasi membutuhkan akses MIDI SysEx untuk instrumen.'" $PLIST || true
        /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 'Aplikasi membutuhkan komunikasi hardware MIDI SysEx.'" $PLIST || true

    - name: Compile Proyek Xcode ke .app
      run: |
        xcodebuild -workspace ios/App/App.xcworkspace \
                   -scheme App \
                   -configuration Release \
                   -sdk iphoneos \
                   CODE_SIGNING_ALLOWED=NO \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGN_IDENTITY="" \
                   BUILD_DIR=$PWD/build

    - name: Bungkus Bebas Korupsi ke Format .ipa
      run: |
        rm -rf Payload MIDI-Royale-Pro.ipa
        mkdir -p Payload
        APP_PATH=$(find build -name "*.app" -type d | head -n 1)
        cp -r "$APP_PATH" Payload/
        zip -r -0 MIDI-Royale-Pro.ipa Payload

    - name: Simpan dan keluarkan File .ipa
      uses: actions/upload-artifact@v4
      with:
        name: MIDI-Royale-Pro-IPA
        path: MIDI-Royale-Pro.ipa
